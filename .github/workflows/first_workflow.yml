name: Our First Workflow

on:                               # <<<   Event / Trigger
  push
                             

jobs:
  job_1:                           # <<<   Job : contains a list of steps that run in the same runner
    runs-on: windows-latest         # <<<   Runner / Environment

    steps:
    # Checks-out your repository so your job can access it
    - name: Checkout Code
      uses: actions/checkout@v4

    # Runs a single command using the runners shell
    - name: List files
      run: ls -alh

     # Runs a set of commands using the runners shell  
    - name: Python version
      run: |
        python -m pip install -r scripts/requirements-external-locations.txt
        python scripts/validate-external-locations.py 
      
