name: Our First Workflow

on:                               # <<<   Event / Trigger
  pull_request: 
                             

jobs:
  job_1:                           # <<<   Job : contains a list of steps that run in the same runner
    runs-on: ubuntu-latest         # <<<   Runner / Environment

    steps:
    # Checks-out your repository so your job can access it
    - name: Checkout Code
      uses: actions/checkout@v4

     # Runs a set of commands using the runners shell  
    - name: check user and working dir
      run: |
        whoami
        python --version 
      
